# ------------- TEST OF EXAMPLES -------------
#
# Configuration of examples with Debug flag ON
.runconfigure-test: &runconfigure-test
  - source ../../../config.txt
  - ../configure --with-geant4=${GEANT4LOCATION} --with-gsl=${GSLLOCATION} --enable-debug

# Configuration of examples with Debug flag ON and ROOT
.runconfigure-test-root: &runconfigure-test-root
  - source ../../../config.txt
  - ../configure --with-geant4=${GEANT4LOCATION} --with-gsl=${GSLLOCATION} --with-root --enable-debug


# Feed coverage to GitLab as suggested by R. Dusaev
.gcovr-script: &gcovr-script
  - >
    gcovr -r $(readlink -f .) \
      --object-directory=$(readlink -f .) \
      --exclude-throw-branches \
      --exclude-unreachable-branches \
      --gcov-ignore-parse-errors \
      --xml=coverage.${CI_COMMIT_BRANCH}.xml \
      --txt

.coverage-artifacts:
  coverage: '/^TOTAL.*\s+(\d+\%)$/'
  artifacts:
    expire_in: 12 hours
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.${CI_COMMIT_BRANCH}.xml
    paths:
      - examples/DarkMatterCS/testCS/testDP.log
      - examples/DarkMatterCS/testCS/testSC.log
      - examples/DarkMatterCS/testCS/testPS.log
      - examples/DarkMatterCS/testCS/testAX.log


.run-Geant4-examples: &run-Geant4-examples
  - cd examples/Geant4/example2
  - *runconfigure-test
  - make
  - source config.sh
  # Test A' -> invis
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=1 -pDecayType=0 -pBranchingType=0
  # Test A' -> e+e-
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=1 -pDecayType=1 -pBranchingType=0
  # Test A' -> chi_1 chi_2
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=1 -pDecayType=2 -pBranchingType=2 -pAlphaD=0.1
  # Test A' -> chi_i chi_j (dirac inelastic)
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=1 -pDecayType=2 -pBranchingType=3 -pAlphaD=0.1
  # Test Sc -> invis
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=2 -pDecayType=0 -pBranchingType=0
  # Test Sc -> e+e-
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=2 -pDecayType=1 -pBranchingType=0
  # Test Ax -> invis
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=3 -pDecayType=0 -pBranchingType=0
  # Test Ax -> e+e-
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=3 -pDecayType=1 -pBranchingType=0
  # Test Ps -> invis
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=4 -pDecayType=0 -pBranchingType=0
  # Test Ps -> e+e-
  - ./mkgeant4 -w cardg_test.g4mac -pDMMass=0.0167 -pEpsilon=0.001 -pBiasSigmaFactor0=1.e9 -pDMProcess=4 -pDecayType=1 -pBranchingType=0
  - cd ../../../


.run-CS-examples: &run-CS-examples
  - cd examples/DarkMatterCS/example1
  - *runconfigure-test
  - make
  - ./mkgeant4
  - cd ..
  
  # test DMG4 cross section stability
  - cd testCS
  - *runconfigure-test
   
  - sed -r 's#DM_TYPE_NAME#DarkPhotons#g' mkgeant4.cc.template > mkgeant4.cc
  - make
  - ./mkgeant4 > testDP.log

  - sed -r 's#DM_TYPE_NAME#DarkScalars#g' mkgeant4.cc.template > mkgeant4.cc
  - make
  - ./mkgeant4 > testSC.log
  
  - sed -r 's#DM_TYPE_NAME#DarkPseudoScalars#g' mkgeant4.cc.template > mkgeant4.cc
  - make
  - ./mkgeant4 > testPS.log
  
  - sed -r 's#DM_TYPE_NAME#DarkAxials#g' mkgeant4.cc.template > mkgeant4.cc
  - make
  - ./mkgeant4 > testAX.log

  - cd ..
 
  # test DMG4 cross section stability for annihilation
  - cd testAnnihilationCS
  - *runconfigure-test-root
  - make
  - ./mkgeant4
  - cd ../../../


# EXAMPLE COMPILATION AND TESTING
test-example-geant4:
  stage: test
  dependencies:
    - build-el9
  extends:
    - .compile-configuration
    - .coverage-artifacts
  script:
    - *run-Geant4-examples
    - *gcovr-script

test-examples:
  stage: test
  dependencies:
    - build-el9
  extends:
    - .compile-configuration
    - .coverage-artifacts
  script:
    - *run-CS-examples
    - *gcovr-script
