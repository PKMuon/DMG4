# gitlab ci service
# https://cern.service-now.com/service-portal/article.do?n=KB0003690
# https://gitlab.cern.ch/help/ci/yaml/README.md

# use the default image for build (currently slc7)
# image: slc6

build:
  stage: build

  tags:
  # Make your job be executed in a shared runner that has CVMFS mounted
  - cvmfs

  # install the necessary build tools
  before_script:
    - yum -q -y install libSM qt qt5

  # build and test DMG4 and na64-tools/geant4/simulation
  script:
    - cat /etc/redhat-release

    - cd src
    - echo "List of files with TAB char:"
    - echo '! grep -r -nP "\t" *' | bash
    - echo "List of files with CR char:"
    - grep -r -lP "\r" * || true
    - cd -
    - cd include
    - echo "List of files with TAB char:"
    - echo '! grep -r -nP "\t" *' | bash
    - echo "List of files with CR char:"
    - grep -r -lP "\r" * || true
    - cd -

    - source /cvmfs/sft.cern.ch/lcg/views/setupViews.sh LCG_96b x86_64-centos7-gcc62-opt
    - ./runconfigure_lcg
    - make
    - make install
